# Quarto configuration for dry homework PDF generation
# This configuration is used when rendering individual homework files to PDF

format:
  pdf:
    documentclass: article
    papersize: a4
    toc: true
    number-sections: true
    geometry:
      - margin=1in
    keep-tex: true
    include-in-header:
      text: |
        \usepackage{amsmath}
        \usepackage{amssymb}
        \usepackage{amsthm}
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    code-copy: true
    code-fold: false
    # fig-height: 3
    # fig-column: page-right
    grid:
      sidebar-width: 200px
      body-width: 1400px
      margin-width: 300px
      gutter-width: 1.5rem