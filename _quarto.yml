project:
  type: website
  output-dir: _site

website:
  title: "Switched Voltage Converters (00440139)"
  page-navigation: true
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Lectures"
        href: Lectures/index.qmd
      - text: "Tutorials"
        href: Tutorials/index.qmd
      - text: "Homeworks"
        menu:
          - text: "Dry Homeworks"
            href: Homeworks/dry/index.qmd
          - text: "Wet Homeworks"
            href: Homeworks/wet/index.qmd
      - text: "Books"
        href: books/index.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    code-copy: true
    code-fold: false
    fig-width: 5
    fig-height: 3
    # fig-column: page-right
    grid:
      sidebar-width: 200px
      body-width: 1400px
      margin-width: 300px
      gutter-width: 1.5rem
    html-math-method: katex
  pdf:
    documentclass: scrartcl
    papersize: a4
    toc: true
    number-sections: true
    geometry:
      - margin=1in
    keep-tex: true
    include-in-header:
      - text: |
                  \usepackage{amsmath}
                  \usepackage{amssymb}
                  \usepackage{amsthm}
                  \usepackage{cancel}
                  \usepackage{tikz}
                  \usepackage{circuitikz}
                  \newcommand{\lt}{\ensuremath <}
                  \newcommand{\gt}{\ensuremath >}
filters:
  - tikz-to-svg
