name: Publish Quarto Site

on:
  push:
    branches:
      - main # Or whatever your default branch is named
  workflow_run:
    workflows: ["Summarize Tutorials PDFs", "Summarize Lectures PDFs"]
    types:
      - completed
  workflow_dispatch: # Added here too for easy manual testing!

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: switched-voltage-converters
          python-version: 3.11

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Install rsvg-convert (librsvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --version

      - name: Install TinyTex for Quarto
        shell: bash -el {0}
        run: quarto install tinytex

      - name: Install LaTeX for lcapy
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-pictures texlive-science

      - name: Render Quarto Project (in conda env)
        shell: bash -el {0}
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
